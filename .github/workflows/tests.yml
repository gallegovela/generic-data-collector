name: Tests

# Se ejecuta en cada push y cada pull request, sin filtro de rutas
# (RF-PLT-05, CA-PLT-02: cualquier error de tipos hace fallar el job).

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # RF-PLT-06: tests e2e contra una base de datos de pruebas real.
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formia
          POSTGRES_PASSWORD: formia
          POSTGRES_DB: formia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://formia:formia@localhost:5432/formia
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY: changeme
      S3_SECRET_KEY: changeme
      S3_BUCKET: formia
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e
