name: Issue pipeline

# Label-gated stages, each running the local `claude` CLI on the
# ionosL1 self-hosted runner as one of the project agents defined in
# .claude/agents/ (see CLAUDE.md, "Agentes y flujo de trabajo").
# Authenticated via CLAUDE_CODE_OAUTH_TOKEN (a long-lived token from
# `claude setup-token`, stored as an organization secret), so agents use
# the Claude subscription. Every agent runs through
# .github/scripts/run-agent.mjs, which stops it when the subscription's
# 5-hour or weekly usage reaches AGENT_MAX_FIVE_HOUR_PCT /
# AGENT_MAX_SEVEN_DAY_PCT (repository variables, default 90). A stopped
# stage posts a note with the reset time, keeps the issue's label and does
# not hand over; a comment on the issue re-runs it.
#
# analysis -> architect. Reviews the request against the whole project,
#             argues the architecture, points out errors and improvements,
#             and creates one child issue per development piece. Read-only
#             on the repository; writes only to GitHub issues.
# design   -> analyst-programmer, supervised by the architect. Creates or
#             reuses branch issue-<n>, updates specs/ (requirements, design
#             and the module's test plan, specs/<module>/test-plan.md), and
#             leaves the developer's action plan as the LAST comment:
#               1. analyst drafts specs changes + plan (comment)
#               2. architect reviews it (comment with a verdict)
#               3. analyst applies the review and posts the final plan
#             If a human decision is needed, the question is left in the
#             issue with the `needs-info` label and the stage stops.
# develop  -> developer. On branch issue-<n>, implements the final plan,
#             runs lint/typecheck/tests, pushes and opens the PR. When the
#             PR is open it swaps the `develop` label for `pr-raised`.
# testPR   -> analyst-programmer (label `pr-raised`). Runs the module's
#             test plan on the PR branch before merging and posts the
#             result in the PR conversation. Never merges. The workflow then
#             swaps `pr-raised` for `merge` (passed) or `human-review`
#             (failed, blocked or no result).
# merge    -> architect (label `merge`). Gathers EVERY open issue of the
#             same module(s) (labels `module:<x>`, except `analysis`
#             parents). The module is merged in one single step, so any
#             issue that is not ready blocks it: not started yet, still in
#             design/develop/testPR, `human-review`, or without an open PR.
#             When all are ready, the architect either
#               - asks for a global module test (creates or reuses an
#                 `integration` issue, which goes to `module-test`), or
#               - approves and merges every PR in dependency order; the
#                 workflow then deploys.
# module-test -> analyst-programmer (label `module-test`, on an
#             `integration` issue). The workflow builds branch issue-<m>
#             from main plus every PR branch of the module; the analyst
#             writes or updates the global section of the module's test
#             plan, runs it there and reports in the issue. The workflow
#             opens the integration PR, sets `module-test-done` and hands
#             back to the merge stage, where the architect analyses it.
#
# After analysis the pipeline runs on its own: the architect creates the
# children with `design` (the workflow dispatches their design stage),
# the analyst swaps `design` for `develop` once the final plan is posted
# (the workflow dispatches develop), and so on until the module is merged
# or an issue stops in `needs-info` or `human-review` for a person.
#
# develop, testPR and module-test run on the `ionos-l1-test` runner, whose
# Docker daemon is a Docker-in-Docker sidecar isolated from the host (and
# from the deployed demo). They test the branch in containers:
# `npm run test:stack:up` builds and starts it (docker-compose.test.yml)
# and every check runs inside its `tests` container through
# `npm run test:stack:run -- <command>`. See specs/platform/design.md.
#
# Re-triggers on a human comment too (not just a fresh label), so
# answering a question in the thread re-runs the *current* label's stage.
# Comments and labels written by this workflow use GITHUB_TOKEN, which
# never triggers new workflow runs, so the pipeline cannot loop on itself.
# For the same reason, when a stage hands over to the next one it
# dispatches this same workflow (workflow_dispatch, inputs `issue` and
# `stage`), which GITHUB_TOKEN is allowed to do. The same inputs let a
# person re-run a stage by hand from the Actions tab.
#
# The merge stage approves and merges as the architect's GitHub App: a
# one-hour installation token generated from vars.ARCHITECT_APP_ID and
# secrets.ARCHITECT_APP_PRIVATE_KEY. It needs an identity other than the
# PR author because GitHub does not let the author approve its own PR.
# Fallbacks, in order: secrets.ARCHITECT_GH_TOKEN (a PAT of a bot
# account), then GITHUB_TOKEN (approval fails on PRs it opened). A merge
# made with the App token or the PAT fires `push` and deploys by itself;
# a merge made with GITHUB_TOKEN does not, so the stage dispatches
# deploy.yml instead.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Número del issue
        required: true
        type: string
      stage:
        description: Etapa a ejecutar
        required: true
        type: choice
        options: [design, develop, test-pr, merge, module-test]

permissions:
  actions: write        # gh workflow run: hand-overs between stages and deploy.yml
  contents: write
  issues: write
  pull-requests: write

# One run at a time per issue; queue instead of cancelling so that a
# comment posted mid-run is not lost.
concurrency:
  group: issue-pipeline-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
  BRANCH: issue-${{ github.event.issue.number || inputs.issue }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # Subscription usage (percent) at which an agent is stopped, for the
  # 5-hour and the weekly window. See .github/scripts/run-agent.mjs.
  AGENT_MAX_FIVE_HOUR_PCT: ${{ vars.AGENT_MAX_FIVE_HOUR_PCT || 90 }}
  AGENT_MAX_SEVEN_DAY_PCT: ${{ vars.AGENT_MAX_SEVEN_DAY_PCT || 90 }}

jobs:
  check-permission:
    # Hand-invoking the CLI (instead of the marketplace action) means we
    # lose its built-in write-access check -- added back here, once,
    # shared by every stage job via `needs`. Also ignores PR comments and
    # bot comments.
    if: ${{ !github.event.issue.pull_request && (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') }}
    runs-on: ionos-l1-claude
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only accounts with write access can dispatch a workflow, and
          # the hand-overs between stages come from this workflow itself.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [ "$perm" = "admin" ] || [ "$perm" = "write" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # Stage 1: analysis (architect)
  # ---------------------------------------------------------------------
  analysis:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'analysis') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'analysis')))
    runs-on: ionos-l1-claude
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Wrapper that stops the agent before it uses up the Claude
      # subscription. Taken from the workflow's own commit, not from the
      # issue branch, which may be older.
      - name: Fetch the agent runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/run-agent.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/run-agent.mjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/issue-thread.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/issue-thread.mjs"

      # Children are found through "Padre: #<n>" in their body, with the
      # list API (the search API lags behind newly created issues).
      - name: Remember the existing child issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state all --limit 500 --json number,body \
            --jq "[.[] | select(.body | test(\"Padre: #$ISSUE_NUMBER\\\\b\")) | .number]" > "$RUNNER_TEMP/children-before.json"

      - name: Architect - analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODIES="$RUNNER_TEMP/bodies"
          rm -rf "$BODIES" && mkdir -p "$BODIES"
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full, then specs/README.md and every specs/<module>/ that issue #$ISSUE_NUMBER may touch.
          Read issue #$ISSUE_NUMBER and its whole thread: node $RUNNER_TEMP/issue-thread.mjs $ISSUE_NUMBER.
          List the child issues it already has: gh issue list --state all --search "Padre: #$ISSUE_NUMBER in:body".

          You are in the ANALYSIS stage. Your job:
          1. Analyse the request against the whole project: architecture, module boundaries, data model, offline, multi-tenant, GDPR and the demo path.
          2. Propose the architecture of the solution and ARGUE every decision (alternatives considered, pros and cons).
          3. Point out errors, contradictions, risks and possible improvements, both in the request and in the current specs/, and give concrete suggestions on how to proceed.
          4. If a decision needs the product owner's approval, ask it (numbered questions, each with a default proposal), add the label with
             gh issue edit $ISSUE_NUMBER --add-label needs-info
             and do NOT create child issues yet. If the thread already answers your previous questions, remove needs-info and continue.
          5. Otherwise create one child issue per development piece (normally one per module affected), following the "design" issue template of the github-issues skill,
             The body must contain the line "Padre: #$ISSUE_NUMBER". Write it with the Write tool to a file in $BODIES/ (for example $BODIES/child-1.md),
             then create the issue in a single-line command:
             gh issue create --title '...' --label design --label "module:<module>" --body-file $BODIES/child-1.md
             (create a missing label with gh label create). Never pass a body inline with --body: the permission check denies any multi-line command
             with a line that starts with # (every Markdown heading), and pipes, heredocs and command substitution are denied too.
             Quote --title with SINGLE quotes; if it needs an apostrophe, write ’ instead of '.
             The design label starts the analyst's design stage right away, so only create a child when its piece is fully decided.
             Pieces of the same module are merged together in one single step, so each one must be developable from $DEFAULT_BRANCH on its own:
             do not make a piece depend on another unmerged piece of the same module (merge them into one child instead).
             Do not duplicate children that already exist; update them with gh issue edit instead.
          6. Update the task list of issue #$ISSUE_NUMBER with its children, keeping the original text: write the whole new body to $BODIES/parent.md
             and run gh issue edit $ISSUE_NUMBER --body-file $BODIES/parent.md
          You must not modify any file in the repository; the only files you may write are the issue bodies in $BODIES/.

          Your final answer is posted verbatim as a comment on the issue: write it for the product owner, in the same language as the issue, with sections
          Análisis, Arquitectura propuesta, Errores y mejoras detectados, Recomendaciones, Issues creados (or Preguntas pendientes) and Siguiente paso.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Edit(/$BODIES/**)"
            "Bash(node $RUNNER_TEMP/issue-thread.mjs *)"
            "Bash(git log:*)" "Bash(git diff:*)" "Bash(git show:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh issue create:*)" "Bash(gh issue edit:*)"
            "Bash(gh label list:*)" "Bash(gh label create:*)"
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/analysis.md -p "$PROMPT" \
            --agent architect \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}"

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/analysis.md ] || echo "⚠️ La etapa de análisis ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/analysis.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/analysis.md

      # Labels set with GITHUB_TOKEN do not trigger runs, so the design
      # stage of every child created in this run is dispatched here. Only
      # new open children: the ones that existed before are already in
      # their own stage. Nothing starts while the parent waits for answers.
      - name: Start the design stage of the new children
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -qx needs-info; then
            echo "The parent is waiting in needs-info; no child starts."
            exit 0
          fi
          gh label create design --color d73a4a --description "Etapa design: analista programador" 2>/dev/null || true
          NEW=$(gh issue list --state open --limit 500 --json number,body \
            --jq "[.[] | select(.body | test(\"Padre: #$ISSUE_NUMBER\\\\b\")) | .number] - $(cat "$RUNNER_TEMP/children-before.json") | .[]")
          for CHILD in $NEW; do
            gh issue edit "$CHILD" --add-label design
            gh workflow run issue-pipeline.yml --ref "$DEFAULT_BRANCH" -f issue="$CHILD" -f stage=design
            echo "Design stage dispatched for #$CHILD"
          done

  # ---------------------------------------------------------------------
  # Stage 2: design (analyst-programmer, supervised by the architect)
  # ---------------------------------------------------------------------
  design:
    needs: check-permission
    if: >-
      needs.check-permission.outputs.allowed == 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'design') ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'design')) ||
        (github.event_name == 'workflow_dispatch' && inputs.stage == 'design')
      )
    runs-on: ionos-l1-claude
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Wrapper that stops the agent before it uses up the Claude
      # subscription. Taken from the workflow's own commit, not from the
      # issue branch, which may be older.
      - name: Fetch the agent runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/run-agent.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/run-agent.mjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/issue-thread.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/issue-thread.mjs"

      - name: Configure git remote and identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"

      - name: Create or reuse the issue branch
        run: |
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Analyst - draft design
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH.
          Read issue #$ISSUE_NUMBER and its whole thread (node $RUNNER_TEMP/issue-thread.mjs $ISSUE_NUMBER), its parent issue and the specs/ of the modules involved.

          You are in the DESIGN stage, step 1 of 3 (draft). Your job:
          1. Update specs/ with the new changes: requirements in specs/<module>/README.md and technical design in specs/<module>/design.md, following the spec-writing and technical-design skills.
             Keep the change history of each file and cite issue #$ISSUE_NUMBER.
          2. Create the module's test plan specs/<module>/test-plan.md from specs/_template/test-plan.md, or update it if it already exists, with test cases PP-<MOD>-NN
             for every acceptance criterion this issue adds or changes. It will be run in the testPR stage on the PR branch, before merging: every case must be
             executable by an agent from the command line (exact commands and a checkable expected result); anything only a person can verify goes to "Comprobaciones manuales".
          3. Commit the specs/ changes on $BRANCH (git add specs/ && git commit -m "docs(<module>): ... (#$ISSUE_NUMBER)"). Do not push. Do not touch anything outside specs/.
          4. Draft the action plan for the developer: files to create or modify, signatures and contracts, step-by-step order, tests per acceptance criterion and definition of done.
          5. List any doubt or decision you need approved. Address it to the architect, who reviews your work in the next step.

          Your final answer is posted verbatim as a comment on the issue, in the same language as the issue, titled
          "## Propuesta del analista (pendiente de revisión del arquitecto)", with sections Cambios en specs, Plan de pruebas, Plan de acción (borrador) and Preguntas para el arquitecto.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(node $RUNNER_TEMP/issue-thread.mjs *)"
            "Edit(specs/**)" "Write(specs/**)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git add:*)" "Bash(git commit:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)"
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/draft.md -p "$PROMPT" \
            --agent analyst-programmer \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}"

      - name: Post draft comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/draft.md

      - name: Architect - review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH.
          Read issue #$ISSUE_NUMBER and its whole thread (node $RUNNER_TEMP/issue-thread.mjs $ISSUE_NUMBER) and its parent issue.
          The analyst-programmer has just posted a draft design (last comment) and committed specs/ changes: review them with git diff origin/main...HEAD -- specs/.

          You are in the DESIGN stage, step 2 of 3: you supervise the analyst. Your job:
          1. Check that the design fits the architecture agreed in the parent issue and in specs/, respects CLAUDE.md (multi-tenant, GDPR, offline, stack, scope of the pilot) and covers every acceptance criterion.
             Check that specs/<module>/test-plan.md covers every acceptance criterion of the issue and that each case can really be run by an agent before merging.
          2. Point out errors, gaps and improvements, arguing each one, and answer the analyst's questions when you can.
          3. Decide one verdict and write it on the FIRST line of your answer, exactly one of:
             VEREDICTO: APROBADO        -> the analyst can publish the final plan as is
             VEREDICTO: CAMBIOS         -> the analyst must apply your requested changes
             VEREDICTO: PREGUNTA        -> a decision needs the product owner; ask it with numbered questions and a default proposal for each,
                                           and add the label: gh issue edit $ISSUE_NUMBER --add-label needs-info
          You must not modify any file in the repository.

          Your final answer is posted verbatim as a comment on the issue, in the same language as the issue, titled "## Revisión del arquitecto" right after the verdict line.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(node $RUNNER_TEMP/issue-thread.mjs *)"
            "Bash(git log:*)" "Bash(git diff:*)" "Bash(git show:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh issue edit:*)"
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/review.md -p "$PROMPT" \
            --agent architect \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}"
          VERDICT=$(grep -oE 'VEREDICTO: (APROBADO|CAMBIOS|PREGUNTA)' /tmp/review.md | head -1 | cut -d' ' -f2)
          echo "verdict=${VERDICT:-CAMBIOS}" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/review.md

      - name: Analyst - final action plan
        if: steps.review.outputs.verdict != 'PREGUNTA'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH.
          Read issue #$ISSUE_NUMBER and its whole thread (node $RUNNER_TEMP/issue-thread.mjs $ISSUE_NUMBER). The last two comments are your draft and the architect's review (verdict: $VERDICT).

          You are in the DESIGN stage, step 3 of 3 (final). Your job:
          1. Apply every change requested by the architect to specs/ and commit it on $BRANCH (do not push, do not touch anything outside specs/).
             If you disagree with a point, argue it in your answer instead of ignoring it.
          2. If the thread previously had the needs-info label and the questions are now answered, remove it: gh issue edit $ISSUE_NUMBER --remove-label needs-info
          3. Write the FINAL action plan for the developer. It must be self-contained: the developer only reads this comment, CLAUDE.md and specs/.
          4. The developer starts as soon as you finish. If the plan is complete, move the issue to the next stage:
             gh issue edit $ISSUE_NUMBER --remove-label design --add-label develop
             If something still needs a person's decision, do NOT move it: ask in your answer (numbered questions with a default proposal)
             and add the label instead: gh issue edit $ISSUE_NUMBER --add-label needs-info

          Your final answer is posted verbatim as the LAST comment of the issue, in the same language as the issue, titled
          "## Plan de acción para el desarrollador", with sections Contexto, Rama ($BRANCH), Specs de referencia, Ficheros (table: acción, ruta, contenido),
          Contratos, Pasos en orden, Tests (one per acceptance criterion), Plan de pruebas (link to specs/<module>/test-plan.md and the PP cases the PR must pass),
          Definición de hecho and Cambios respecto a la revisión del arquitecto.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(node $RUNNER_TEMP/issue-thread.mjs *)"
            "Edit(specs/**)" "Write(specs/**)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git add:*)" "Bash(git commit:*)"
            "Bash(gh issue view:*)" "Bash(gh issue edit:*)"
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/plan.md -p "$PROMPT" \
            --agent analyst-programmer \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}"

      - name: Push the issue branch
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$(git log "origin/$BRANCH..HEAD" 2>/dev/null || git log "origin/$DEFAULT_BRANCH..HEAD")" ]; then
            git push -u origin "$BRANCH"
          fi

      - name: Post final plan comment
        if: steps.review.outputs.verdict != 'PREGUNTA'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/plan.md

      # Safety net for step 4 of the final prompt, then hand over to
      # develop. Never while a question is pending (needs-info).
      - name: Move the issue to develop
        if: steps.review.outputs.verdict != 'PREGUNTA'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -qx needs-info; then
            gh issue edit "$ISSUE_NUMBER" --remove-label develop --add-label design 2>/dev/null || true
            echo "A question is pending (needs-info); the issue stays in design."
            exit 0
          fi
          gh label create develop --color fbca04 --description "Etapa develop: programador" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --remove-label design --add-label develop
          gh workflow run issue-pipeline.yml --ref "$DEFAULT_BRANCH" -f issue="$ISSUE_NUMBER" -f stage=develop

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/usage-limit.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/usage-limit.md"
          else
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ La etapa de diseño ha fallado. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  # ---------------------------------------------------------------------
  # Stage 3: develop (developer)
  # ---------------------------------------------------------------------
  develop:
    needs: check-permission
    if: >-
      needs.check-permission.outputs.allowed == 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'develop') ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'develop')) ||
        (github.event_name == 'workflow_dispatch' && inputs.stage == 'develop')
      )
    runs-on: ionos-l1-test
    env:
      COMPOSE_PROJECT_NAME: formia-dev-${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Wrapper that stops the agent before it uses up the Claude
      # subscription. Taken from the workflow's own commit, not from the
      # issue branch, which may be older.
      - name: Fetch the agent runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/run-agent.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/run-agent.mjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/issue-thread.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/issue-thread.mjs"

      - name: Configure git remote and identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"

      - name: Developer - implement and open PR
        id: developer
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH, which already holds the specs/ changes for issue #$ISSUE_NUMBER.
          Read the issue and its whole thread (node $RUNNER_TEMP/issue-thread.mjs $ISSUE_NUMBER). The comment titled "Plan de acción para el desarrollador"
          (the latest one, if there are several) is your work order; follow it together with the specs/ it references.
          If a pull request from $BRANCH already exists (gh pr list --head $BRANCH), read its conversation too (node $RUNNER_TEMP/issue-thread.mjs <pr>):
          the "Resultado del plan de pruebas" comments from testPR tell you what failed. Fix what is caused by the code; if a failure comes
          from the test plan or specs/ themselves, do not change them: explain it in your answer.

          You are in the DEVELOP stage. Your job:
          1. Implement exactly what the plan says, with the tests it lists. Do not make design decisions: if the plan is incomplete or contradictory,
             explain what is missing in your answer, add the label (gh issue edit $ISSUE_NUMBER --add-label needs-info) and stop.
          2. Run npm run lint, npm run typecheck and npm test (and the e2e tests if the change touches the demo path). Fix any failure.
             Tests that need PostgreSQL, MinIO or Mailpit, and the e2e tests, run in the containerised test stack, the same one testPR uses:
               npm run test:stack:up                                  (builds the branch and starts web, postgres, minio, mailpit)
               npm run test:stack:run -- npm test                     (any command, inside the stack's tests container)
               npm run test:stack:run -- npx playwright test
               npm run test:stack:logs -- web                         (logs of a service)
             Run npm run test:stack:up again after changing code, so the images are rebuilt. There is no localhost database on this runner.
             If scripts/test-stack.sh does not exist on $BRANCH, merge origin/$DEFAULT_BRANCH into it first (it is older than the test stack).
          3. Commit with Conventional Commits in English citing #$ISSUE_NUMBER, and push: git push -u origin $BRANCH
          4. When the task is ready (plan done, checks green), open the pull request against $DEFAULT_BRANCH, or update it if one already exists
             (gh pr list --head $BRANCH): gh pr create --base $DEFAULT_BRANCH --head $BRANCH --title "<conventional title> (#$ISSUE_NUMBER)" --body "..."
             The body summarises the changes, lists the requirements and acceptance criteria covered, the check results, and ends with "Closes #$ISSUE_NUMBER".
             If the task is not ready, do not open the PR and explain why.
          5. Only once the PR is open, move the issue to the next stage: gh issue edit $ISSUE_NUMBER --remove-label develop --add-label pr-raised
             (create the label first if it does not exist: gh label create pr-raised --color 5319e7 --description "PR abierta: etapa testPR").

          Your final answer is posted verbatim as a comment on the issue, in the same language as the issue: what was done, files touched,
          check results, PR link (or what blocks it).
          EOF
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/develop.md -p "$PROMPT" \
            --agent developer \
            --dangerously-skip-permissions

      - name: Clean up the test stack
        if: always()
        run: |
          if [ -f scripts/test-stack.sh ]; then sh scripts/test-stack.sh down || true; fi

      - name: Push any remaining commits
        if: always()
        run: |
          if [ -n "$(git log "origin/$BRANCH..HEAD")" ]; then
            git push -u origin "$BRANCH"
          fi

      # Safety net for step 5 of the prompt: if an open PR exists but the
      # label was not swapped, swap it here. Then hand over to testPR.
      # If the developer step failed (crash), the PR may be left over from
      # an earlier run with half-done work on top, so the issue only moves
      # on if the agent itself already swapped the label, which it does
      # only once the PR is ready. A stop for the usage limit never hands
      # over: testPR would be stopped as well.
      - name: Move the issue to pr-raised
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER_OUTCOME: ${{ steps.developer.outcome }}
        run: |
          if [ -f "$RUNNER_TEMP/usage-limit.md" ]; then
            echo "Stopped by the subscription usage limit; no hand-over."
            exit 0
          fi
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          if [ -z "$PR" ]; then
            # Finished without a PR and without a question for a person:
            # the pipeline would stall silently, so a person takes over.
            if [ "$DEVELOPER_OUTCOME" = "success" ] && ! echo "$LABELS" | grep -qx needs-info; then
              gh label create human-review --color d93f0b --description "Necesita revisión de una persona" 2>/dev/null || true
              gh issue edit "$ISSUE_NUMBER" --add-label human-review
              gh issue comment "$ISSUE_NUMBER" --body "Etapa develop: el programador ha terminado sin abrir la PR ni dejar una pregunta (\`needs-info\`). El issue pasa a \`human-review\`: una persona tiene que revisarlo. Para repetir la etapa, quita \`human-review\` y comenta en el issue."
            fi
            exit 0
          fi
          if [ "$DEVELOPER_OUTCOME" != "success" ] && \
             ! echo "$LABELS" | grep -qx pr-raised; then
            echo "Developer step did not finish; the issue stays in develop."
            exit 0
          fi
          gh label create pr-raised --color 5319e7 --description "PR abierta: etapa testPR" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --remove-label develop --add-label pr-raised
          gh workflow run issue-pipeline.yml --ref "$DEFAULT_BRANCH" -f issue="$ISSUE_NUMBER" -f stage=test-pr

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/develop.md ] || echo "⚠️ La etapa de desarrollo ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/develop.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/develop.md

  # ---------------------------------------------------------------------
  # Stage 4: testPR (analyst-programmer), label `pr-raised`
  # ---------------------------------------------------------------------
  test-pr:
    needs: check-permission
    if: >-
      needs.check-permission.outputs.allowed == 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'pr-raised') ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'pr-raised')) ||
        (github.event_name == 'workflow_dispatch' && inputs.stage == 'test-pr')
      )
    runs-on: ionos-l1-test
    env:
      # Isolates the test stack from any other compose project on the
      # host (the deployed demo included), so `down -v` cannot touch it.
      COMPOSE_PROJECT_NAME: formia-testpr-${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Wrapper that stops the agent before it uses up the Claude
      # subscription. Taken from the workflow's own commit, not from the
      # issue branch, which may be older.
      - name: Fetch the agent runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/run-agent.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/run-agent.mjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/issue-thread.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/issue-thread.mjs"

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f /tmp/testpr.md
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          if [ -z "$PR" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ Etapa testPR: no hay ninguna pull request abierta desde \`$BRANCH\`. No se ejecuta el plan de pruebas."
            exit 1
          fi

      # Tests what the merge would produce: the PR branch plus the latest
      # default branch (local only, never pushed). It also brings the test
      # stack to branches created before it existed.
      - name: Merge the latest default branch
        id: base
        run: |
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"
          git fetch origin "$DEFAULT_BRANCH"
          if git merge --no-edit "origin/$DEFAULT_BRANCH"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            printf 'RESULTADO: FALLIDO\n## Resultado del plan de pruebas\n\nLa rama `%s` tiene conflictos con `%s`: el programador tiene que actualizarla. No se ejecuta el plan de pruebas.\n' "$BRANCH" "$DEFAULT_BRANCH" > /tmp/testpr.md
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the test stack
        id: stack
        if: steps.base.outputs.ready == 'true'
        run: |
          if npm run test:stack:up > "$RUNNER_TEMP/stack-up.log" 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/stack-up.log"
          {
            printf 'RESULTADO: FALLIDO\n## Resultado del plan de pruebas\n\nNo se ha podido levantar el entorno de pruebas (`npm run test:stack:up`): falla la construcción de las imágenes de la rama o el arranque de algún servicio. No se ejecuta el plan de pruebas.\n\n<details><summary>Últimas líneas del log</summary>\n\n```\n'
            tail -n 60 "$RUNNER_TEMP/stack-up.log"
            printf '```\n\n</details>\n'
          } > /tmp/testpr.md
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Analyst - run the test plan
        if: steps.stack.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH, the head of pull request #$PR_NUMBER for issue #$ISSUE_NUMBER.
          Read the issue and its whole thread (node $RUNNER_TEMP/issue-thread.mjs $ISSUE_NUMBER), the pull request (node $RUNNER_TEMP/issue-thread.mjs $PR_NUMBER)
          and the files it changes (git diff origin/$DEFAULT_BRANCH...HEAD --stat).
          Find the test plan: the "Plan de pruebas" section of the latest "Plan de acción para el desarrollador" comment points to specs/<module>/test-plan.md.

          The workflow has already merged the latest $DEFAULT_BRANCH into the branch (locally) and started the test stack with npm run test:stack:up:
          the branch's app (service web), PostgreSQL, MinIO and Mailpit run in containers. Every check and case runs inside the stack's tests container:
            npm run test:stack:run -- <command>          e.g. npm run test:stack:run -- npm test
            npm run test:stack:logs -- <service>         logs of web, postgres, minio or mailpit, to explain a failure
          Nothing runs directly on this runner (there are no node_modules and no localhost services), and you must not stop the stack: the workflow does.

          You are in the TESTPR stage. Your job is to verify, before merging, that the pull request passes the test plan:
          1. Skip the step of the "Preparación" that starts the stack (already done) and run the rest, then every "Comprobaciones generales" check
             and every PP case that applies to this issue, exactly as written (inside the stack as above).
          2. For each case record the result: ✅ superado, ❌ fallido (with the relevant part of the output, never secrets or personal data) or ⏭️ no ejecutado (with the reason).
          3. Do not fix anything: do not edit files, commit, push, approve or merge. If a case fails, report it for the developer.
             If the test plan is missing, contradictory or cannot be run, report it for the analyst and the architect and answer BLOQUEADO.
             Do not change labels: the workflow sets `merge` (SUPERADO) or `human-review` (FALLIDO or BLOQUEADO) from your result line.
          4. Run the "Limpieza" steps at the end, even if some case failed.

          The FIRST line of your answer must be exactly one of: RESULTADO: SUPERADO | RESULTADO: FALLIDO | RESULTADO: BLOQUEADO
          Your final answer is posted verbatim in the pull request conversation, in the same language as the issue, titled "## Resultado del plan de pruebas"
          right after the result line, with sections Resumen, Comprobaciones generales (table), Casos de prueba (table: ID, cubre, resultado, detalle),
          Comprobaciones manuales pendientes (for the person who merges) and Siguiente paso.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(node $RUNNER_TEMP/issue-thread.mjs *)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)"
            "Bash(npm run test:stack:run:*)" "Bash(npm run test:stack:logs:*)"
            "Bash(gh issue view:*)" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)"
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/testpr.md -p "$PROMPT" \
            --agent analyst-programmer \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}"

      - name: Clean up the test stack
        if: always()
        run: |
          if [ -f scripts/test-stack.sh ]; then sh scripts/test-stack.sh down || true; fi

      # Only SUPERADO moves the issue to `merge`. Anything else (FALLIDO,
      # BLOQUEADO, a crash with no result line) goes to `human-review`.
      # A stop for the usage limit keeps `pr-raised`.
      - name: Post result and set the next label
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ -f "$RUNNER_TEMP/usage-limit.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/usage-limit.md"
            exit 0
          fi
          [ -s /tmp/testpr.md ] || echo "⚠️ La etapa testPR ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/testpr.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/testpr.md
          RESULT=$(grep -oE 'RESULTADO: (SUPERADO|FALLIDO|BLOQUEADO)' /tmp/testpr.md | head -1 | cut -d' ' -f2)
          RESULT=${RESULT:-SIN_RESULTADO}

          gh label create merge --color 0e8a16 --description "Plan de pruebas superado: etapa merge" 2>/dev/null || true
          gh label create human-review --color d93f0b --description "Necesita revisión de una persona" 2>/dev/null || true
          if [ "$RESULT" = "SUPERADO" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label pr-raised --remove-label human-review --add-label merge
            gh issue comment "$ISSUE_NUMBER" --body "Etapa testPR: SUPERADO. Detalle en #$PR_NUMBER. El issue pasa a \`merge\`."
            gh workflow run issue-pipeline.yml --ref "$DEFAULT_BRANCH" -f issue="$ISSUE_NUMBER" -f stage=merge
          else
            gh issue edit "$ISSUE_NUMBER" --remove-label pr-raised --add-label human-review
            gh issue comment "$ISSUE_NUMBER" --body "Etapa testPR: $RESULT. Detalle en #$PR_NUMBER. El issue pasa a \`human-review\`: una persona tiene que revisarlo. Para repetir las pruebas, pon de nuevo \`pr-raised\`."
          fi


  # ---------------------------------------------------------------------
  # Stage 5: merge (architect), label `merge`
  # ---------------------------------------------------------------------
  merge:
    needs: check-permission
    if: >-
      needs.check-permission.outputs.allowed == 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'merge') ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'merge')) ||
        (github.event_name == 'workflow_dispatch' && inputs.stage == 'merge')
      )
    runs-on: ionos-l1-claude
    # One merge stage at a time across ALL issues: two issues of the same
    # module reaching `merge` together must not merge the same PRs twice.
    concurrency:
      group: issue-pipeline-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Wrapper that stops the agent before it uses up the Claude
      # subscription. Taken from the workflow's own commit, not from the
      # issue branch, which may be older.
      - name: Fetch the agent runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/run-agent.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/run-agent.mjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/issue-thread.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/issue-thread.mjs"

      # Deterministic gate, no agent involved. A module is merged in one
      # single step, so EVERY open issue sharing a `module:<x>` label with
      # this one must be ready (only `analysis` parents are left out):
      #   normal issue:      `merge` + open PR from issue-<n>     -> ready
      #                      anything else (not started, design, develop,
      #                      pr-raised, needs-info, human-review,
      #                      `merge` without PR)                  -> blocking
      #   `integration` one: `module-test-done`                   -> ready, the
      #                      architect reads its result
      #                      anything else                         -> blocking
      - name: Check that every issue of the module is ready
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const labelsOf = (i) => i.labels.map((l) => (typeof l === "string" ? l : l.name));
            const openPr = async (n) => (await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:issue-${n}` })).data[0];

            const self = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const modules = labelsOf(self).filter((l) => l.startsWith("module:"));
            const group = new Map([[self.number, self]]);
            for (const label of modules) {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: label, per_page: 100 });
              for (const i of issues) if (!i.pull_request) group.set(i.number, i);
            }

            const ready = [], blocking = [], integration = [];
            for (const i of [...group.values()].sort((a, b) => a.number - b.number)) {
              const labels = labelsOf(i);
              if (labels.includes("analysis")) continue;
              const line = `#${i.number} ${i.title}`;
              const stage = labels.filter((l) => !l.startsWith("module:") && l !== "integration");
              const pr = await openPr(i.number);
              if (labels.includes("integration")) {
                if (labels.includes("module-test-done")) integration.push({ issue: i.number, pr: pr ? pr.number : null, title: i.title });
                else blocking.push(`${line} — prueba global del módulo sin terminar (\`${stage.join("`, `") || "sin etiqueta"}\`)`);
              } else if (labels.includes("merge") && !labels.includes("human-review") && pr) {
                ready.push({ issue: i.number, pr: pr.number, head: pr.head.sha, title: i.title });
              } else if (labels.includes("merge") && !pr) {
                blocking.push(`${line} — \`merge\` pero sin PR abierta desde \`issue-${i.number}\``);
              } else {
                blocking.push(`${line} — ${stage.length ? `\`${stage.join("`, `")}\`` : "sin empezar"}`);
              }
            }

            // Is the global test still valid? Only if its branch contains the
            // current head commit of every PR of the module.
            for (const t of integration) {
              const stale = [];
              for (const r of ready) {
                try {
                  const cmp = await github.rest.repos.compareCommits({ owner, repo, base: r.head, head: `issue-${t.issue}` });
                  if (!["ahead", "identical"].includes(cmp.data.status)) stale.push(r.pr);
                } catch { stale.push(r.pr); }
              }
              t.stale_prs = stale;
            }

            const list = (xs) => (xs.length ? xs.map((x) => `- ${x}`).join("\n") : "- (ninguno)");
            const summary = [
              `Módulos: ${modules.length ? modules.map((m) => `\`${m}\``).join(", ") : "(el issue no tiene etiqueta \`module:<x>\`; solo se considera él mismo)"}`,
              "", "**Listos (`merge` con PR abierta):**", list(ready.map((r) => `#${r.issue} ${r.title} → PR #${r.pr}`)),
              "", "**Prueba global del módulo (`integration`):**",
              list(integration.map((t) => `#${t.issue} ${t.title} → ${t.pr ? `PR #${t.pr}` : "sin PR"}${t.stale_prs.length ? ` — desactualizada respecto a ${t.stale_prs.map((n) => `#${n}`).join(", ")}` : " — al día"}`)),
              "", "**Pendientes (bloquean la fusión del módulo):**", list(blocking),
            ].join("\n");

            core.setOutput("ready", blocking.length === 0 && ready.length > 0 ? "true" : "false");
            core.setOutput("modules", modules.join(" "));
            core.setOutput("prs", JSON.stringify(ready));
            core.setOutput("integration", JSON.stringify(integration));
            core.setOutput("summary", summary);

      - name: Report that the module is not ready yet
        if: steps.gate.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.gate.outputs.summary }}
        run: |
          printf '## Etapa merge: en espera\n\nNo se fusiona nada: un módulo se fusiona en un solo paso y hay issues del módulo que no están listos. La etapa se repetirá cuando otro issue del módulo pase a `merge`.\n\n%s\n' "$SUMMARY" > /tmp/merge.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/merge.md

      # Short-lived token of the architect's GitHub App, scoped to this
      # repository. Skipped when the App is not configured.
      - name: Get the architect App token
        id: architect-token
        if: steps.gate.outputs.ready == 'true' && vars.ARCHITECT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ARCHITECT_APP_ID }}
          private-key: ${{ secrets.ARCHITECT_APP_PRIVATE_KEY }}

      - name: Architect - review, global test or approve and merge
        if: steps.gate.outputs.ready == 'true'
        env:
          # A different identity from the PR author is needed to approve.
          GH_TOKEN: ${{ steps.architect-token.outputs.token || secrets.ARCHITECT_GH_TOKEN || github.token }}
          PRS: ${{ steps.gate.outputs.prs }}
          INTEGRATION: ${{ steps.gate.outputs.integration }}
          MODULES: ${{ steps.gate.outputs.modules }}
          SUMMARY: ${{ steps.gate.outputs.summary }}
        run: |
          BODIES="$RUNNER_TEMP/bodies"
          rm -rf "$BODIES" && mkdir -p "$BODIES"
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full and specs/README.md. Issue #$ISSUE_NUMBER has just reached the MERGE stage.
          The workflow has already checked that EVERY open issue of module(s) $MODULES is ready (tests passed, PR open):
          $SUMMARY

          Pull requests of the module (JSON: issue, pr, head commit): $PRS
          Global module test issues (JSON, label integration; stale_prs = PRs whose current head is not in the tested branch): $INTEGRATION

          You are in the MERGE stage. The module is merged in ONE single step, and you are the only one who decides it. Choose exactly one path:

          A) GLOBAL TEST NEEDED. With the full view of the module, decide whether its pieces must be tested together before merging
             (shared contracts or migrations, the same files, flows that cross several PRs, anything "in the air" between them).
             Also take this path when an integration issue exists but is stale, or failed because of the test plan itself.
             - If there is no integration issue for the module, create one with the "issue de prueba global" template of the github-issues skill:
               write the body with the Write tool to $BODIES/integration.md and run, in a single line:
               gh issue create --title 'Prueba global del módulo <module>' --label integration --label "module:<module>" --body-file $BODIES/integration.md
             - If there is one, write its new body with what must be tested now to $BODIES/integration.md and run: gh issue edit <m> --body-file $BODIES/integration.md
             - Never pass a body inline with --body: the permission check denies any multi-line command with a line that starts with # (every Markdown heading),
               and pipes, heredocs and command substitution are denied too. Quote --title with SINGLE quotes.
             Do NOT add the module-test label yourself; the workflow does it. Merge nothing.
             Write this line in your answer: PRUEBA-GLOBAL: #<m>

          B) GLOBAL TEST FAILED (integration issue up to date with RESULTADO: FALLIDO or BLOQUEADO; read it with node $RUNNER_TEMP/issue-thread.mjs <m>).
             Analyse the failure, decide which issue(s) must be fixed and mark them: gh issue edit <n> --remove-label merge --add-label human-review
             Explain the fix needed for each one. Merge nothing.

          C) MERGE. Only if no global test is needed, or the integration issue is up to date with RESULTADO: SUPERADO.
             1. Check EVERY PR before touching any: the last "Resultado del plan de pruebas" is SUPERADO for its current head, no CI check is failing
                (gh pr checks <pr>; "no checks reported" is fine: pushes made by this pipeline do not trigger CI, and testPR is the gate),
                it is mergeable (gh pr view <pr> --json mergeable,mergeStateStatus,baseRefName) against $DEFAULT_BRANCH, and the PRs fit specs/ and each other.
                If any check fails, merge nothing: mark that issue with human-review as in B and explain why.
             2. Approve every PR: gh pr review <pr> --approve --body "Aprobada por el arquitecto en la etapa merge del módulo (#$ISSUE_NUMBER)."
             3. Merge them in dependency order ("Depende de: #<n>" first, otherwise ascending issue number), the integration PR (if any) last:
                gh pr merge <pr> --merge
                Re-check mergeable before each one. If one unexpectedly fails, stop, mark its issue with human-review and say clearly which PRs are already merged.

          Never edit repository files, push, or close issues by hand ("Closes #<n>" closes them); the only files you may write are issue bodies in $BODIES/.
          Deployment is handled by the workflow.

          The FIRST line of your answer must be exactly one of:
          FUSIÓN: COMPLETA | FUSIÓN: PARCIAL | FUSIÓN: NINGUNA | FUSIÓN: PRUEBA-GLOBAL
          Your final answer is posted verbatim as a comment on issue #$ISSUE_NUMBER, in the same language as the issue, with the "etapa merge" template
          of the github-issues skill.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Edit(/$BODIES/**)"
            "Bash(node $RUNNER_TEMP/issue-thread.mjs *)"
            "Bash(git log:*)" "Bash(git diff:*)" "Bash(git show:*)" "Bash(git fetch:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh issue edit:*)" "Bash(gh issue create:*)"
            "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)" "Bash(gh pr list:*)"
            "Bash(gh pr review:*)" "Bash(gh pr merge:*)"
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/merge.md -p "$PROMPT" \
            --agent architect \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}"

      - name: Hand over to module-test if a global test was requested
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M=$(grep -oE 'PRUEBA-GLOBAL: #[0-9]+' /tmp/merge.md 2>/dev/null | head -1 | grep -oE '[0-9]+' || true)
          [ -n "$M" ] || exit 0
          gh label create integration --color 1d76db --description "Issue de prueba global de un módulo" 2>/dev/null || true
          gh label create module-test --color 5319e7 --description "Etapa module-test: prueba global del módulo" 2>/dev/null || true
          gh label create module-test-done --color c2e0c6 --description "Prueba global terminada: la analiza el arquitecto" 2>/dev/null || true
          gh issue edit "$M" --add-label integration --remove-label module-test-done --remove-label human-review --add-label module-test
          gh workflow run issue-pipeline.yml --ref "$DEFAULT_BRANCH" -f issue="$M" -f stage=module-test

      # Counts merges from GitHub itself, not from the agent's answer.
      - name: Deploy if anything was merged
        id: deploy
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.gate.outputs.prs }}
          INTEGRATION: ${{ steps.gate.outputs.integration }}
          HAS_ARCHITECT_TOKEN: ${{ steps.architect-token.outputs.token != '' || secrets.ARCHITECT_GH_TOKEN != '' }}
        run: |
          MERGED=""
          for PR in $(echo "$PRS $INTEGRATION" | grep -oE '"pr":[0-9]+' | cut -d: -f2); do
            if [ "$(gh pr view "$PR" --json state --jq .state)" = "MERGED" ]; then
              MERGED="$MERGED #$PR"
            fi
          done
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"
          # A merge made with the App token or ARCHITECT_GH_TOKEN fires
          # `push` and deploy.yml runs by itself; with GITHUB_TOKEN it must
          # be dispatched.
          if [ -n "$MERGED" ] && [ "$HAS_ARCHITECT_TOKEN" != "true" ]; then
            gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
          fi

      - name: Post result comment
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED: ${{ steps.deploy.outputs.merged }}
        run: |
          [ -s /tmp/merge.md ] || echo "⚠️ La etapa merge ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/merge.md
          if [ -n "$MERGED" ]; then
            printf '\n\n---\nPRs fusionadas:%s. Despliegue: %s/%s/actions/workflows/deploy.yml\n' "$MERGED" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> /tmp/merge.md
          else
            printf '\n\n---\nNo se ha fusionado ninguna PR; no se despliega.\n' >> /tmp/merge.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/merge.md

  # ---------------------------------------------------------------------
  # Stage 6: module-test (analyst-programmer), label `module-test`
  # on an `integration` issue created by the architect
  # ---------------------------------------------------------------------
  module-test:
    needs: check-permission
    if: >-
      needs.check-permission.outputs.allowed == 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'module-test') ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'module-test')) ||
        (github.event_name == 'workflow_dispatch' && inputs.stage == 'module-test')
      )
    runs-on: ionos-l1-test
    env:
      COMPOSE_PROJECT_NAME: formia-moduletest-${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Wrapper that stops the agent before it uses up the Claude
      # subscription. Taken from the workflow's own commit, not from the
      # issue branch, which may be older.
      - name: Fetch the agent runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/run-agent.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/run-agent.mjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/issue-thread.mjs?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/issue-thread.mjs"

      - name: Configure git remote and identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"

      - name: Find the module's pull requests
        id: module
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const labelsOf = (i) => i.labels.map((l) => (typeof l === "string" ? l : l.name));
            const self = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const modules = labelsOf(self).filter((l) => l.startsWith("module:"));
            if (!modules.length) core.setFailed(`#${issueNumber} no tiene etiqueta module:<x>`);
            const seen = new Map();
            for (const label of modules) {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: label, per_page: 100 });
              for (const i of issues) {
                const labels = labelsOf(i);
                if (i.pull_request || i.number === issueNumber || labels.includes("analysis") || labels.includes("integration")) continue;
                const pr = (await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:issue-${i.number}` })).data[0];
                if (pr) seen.set(i.number, { issue: i.number, pr: pr.number, branch: pr.head.ref, title: i.title });
              }
            }
            const prs = [...seen.values()].sort((a, b) => a.issue - b.issue);
            core.setOutput("modules", modules.map((m) => m.slice("module:".length)).join(" "));
            core.setOutput("branches", prs.map((p) => p.branch).join(" "));
            core.setOutput("prs", JSON.stringify(prs));

      # issue-<m> is rebuilt from scratch on every run: default branch plus
      # every PR branch of the module, merged in issue order.
      - name: Build the integration branch
        id: build
        env:
          BRANCHES: ${{ steps.module.outputs.branches }}
        run: |
          rm -f /tmp/moduletest.md
          git fetch origin
          git checkout -B "$BRANCH" "origin/$DEFAULT_BRANCH"
          CONFLICTS=""
          for B in $BRANCHES; do
            if ! git merge --no-ff --no-edit "origin/$B"; then
              git merge --abort
              CONFLICTS="$CONFLICTS $B"
            fi
          done
          echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
          if [ -n "$CONFLICTS" ]; then
            printf 'RESULTADO: BLOQUEADO\n## Resultado de la prueba global del módulo\n\nNo se ha podido construir la rama `%s`: hay conflictos al fusionar%s sobre `%s` y lo ya fusionado. No se ejecutan las pruebas.\n' "$BRANCH" "$CONFLICTS" "$DEFAULT_BRANCH" > /tmp/moduletest.md
          fi

      - name: Start the test stack
        id: stack
        if: steps.build.outputs.conflicts == ''
        run: |
          if npm run test:stack:up > "$RUNNER_TEMP/stack-up.log" 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/stack-up.log"
          {
            printf 'RESULTADO: FALLIDO\n## Resultado de la prueba global del módulo\n\nNo se ha podido levantar el entorno de pruebas (`npm run test:stack:up`) con todas las PRs del módulo juntas. No se ejecutan las pruebas.\n\n<details><summary>Últimas líneas del log</summary>\n\n```\n'
            tail -n 60 "$RUNNER_TEMP/stack-up.log"
            printf '```\n\n</details>\n'
          } > /tmp/moduletest.md
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Analyst - write and run the global test plan
        if: steps.build.outputs.conflicts == '' && steps.stack.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES: ${{ steps.module.outputs.modules }}
          PRS: ${{ steps.module.outputs.prs }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH, built by the workflow from $DEFAULT_BRANCH plus every open PR of module(s) $MODULES:
          $PRS
          Read issue #$ISSUE_NUMBER and its whole thread (node $RUNNER_TEMP/issue-thread.mjs $ISSUE_NUMBER): the architect explains there what must be tested together.
          Read the issues and PRs listed above, and specs/<module>/README.md, design.md and test-plan.md.

          You are in the MODULE-TEST stage. Your job:
          1. Write or update the section "Pruebas globales del módulo" of specs/<module>/test-plan.md, following the test-plan skill: cases PP-<MOD>-M<N>
             that test the module's pieces TOGETHER, as the architect asks. Keep the change history citing #$ISSUE_NUMBER.
             Commit it on $BRANCH: git add specs/ && git commit -m "docs(<module>): add global module test plan (#$ISSUE_NUMBER)". Do not push.
          2. The workflow has already started the test stack (npm run test:stack:up) with this branch: app (service web), PostgreSQL, MinIO and Mailpit in containers.
             Skip that step of the "Preparación", run the rest, the "Comprobaciones generales" and every PP-<MOD>-M case exactly as written, all inside
             the stack's tests container: npm run test:stack:run -- <command>. Use npm run test:stack:logs -- <service> to explain a failure.
             Nothing runs directly on this runner, and you must not stop the stack: the workflow does.
          3. Do not fix code: if something fails, say which PR or issue causes it, for the architect. Only specs/ may be edited.

          The FIRST line of your answer must be exactly one of: RESULTADO: SUPERADO | RESULTADO: FALLIDO | RESULTADO: BLOQUEADO
          Your final answer is posted verbatim as a comment on issue #$ISSUE_NUMBER, in the same language as the issue, with the
          "resultado de la prueba global del módulo" template of the github-issues skill.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(node $RUNNER_TEMP/issue-thread.mjs *)"
            "Edit(specs/**)" "Write(specs/**)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git add:*)" "Bash(git commit:*)"
            "Bash(npm run test:stack:run:*)" "Bash(npm run test:stack:logs:*)"
            "Bash(gh issue view:*)" "Bash(gh pr view:*)" "Bash(gh pr diff:*)"
          )
          node "$RUNNER_TEMP/run-agent.mjs" /tmp/moduletest.md -p "$PROMPT" \
            --agent analyst-programmer \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}"

      - name: Clean up the test stack
        if: always()
        run: |
          if [ -f scripts/test-stack.sh ]; then sh scripts/test-stack.sh down || true; fi

      # The integration PR carries the global test plan into main. The
      # architect merges it last, after the module's PRs.
      - name: Push the integration branch and open its PR
        if: always() && steps.build.outputs.conflicts == ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES: ${{ steps.module.outputs.modules }}
        run: |
          [ ! -f "$RUNNER_TEMP/usage-limit.md" ] || exit 0
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "test($MODULES): global module test plan (#$ISSUE_NUMBER)" \
              --body "Rama de integración del módulo \`$MODULES\`: \`$DEFAULT_BRANCH\` + todas sus PRs abiertas, más el plan de pruebas global en \`specs/\`. La fusiona el arquitecto en la etapa \`merge\`, después de las PRs del módulo.

          Closes #$ISSUE_NUMBER"
          fi

      - name: Post result and hand back to the merge stage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/usage-limit.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/usage-limit.md"
            exit 0
          fi
          [ -s /tmp/moduletest.md ] || echo "⚠️ La etapa module-test ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/moduletest.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/moduletest.md
          gh label create module-test-done --color c2e0c6 --description "Prueba global terminada: la analiza el arquitecto" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --remove-label module-test --add-label module-test-done
          gh workflow run issue-pipeline.yml --ref "$DEFAULT_BRANCH" -f issue="$ISSUE_NUMBER" -f stage=merge
