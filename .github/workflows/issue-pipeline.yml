name: Issue pipeline

# Label-gated stages, each running the local `claude` CLI on the
# ionosL1 self-hosted runner as one of the project agents defined in
# .claude/agents/ (see CLAUDE.md, "Agentes y flujo de trabajo").
# Authenticated via CLAUDE_CODE_OAUTH_TOKEN (a long-lived token from
# `claude setup-token`, stored as an organization secret).
#
# analysis -> architect. Reviews the request against the whole project,
#             argues the architecture, points out errors and improvements,
#             and creates one child issue per development piece. Read-only
#             on the repository; writes only to GitHub issues.
# design   -> analyst-programmer, supervised by the architect. Creates or
#             reuses branch issue-<n>, updates specs/ (requirements, design
#             and the module's test plan, specs/<module>/test-plan.md), and
#             leaves the developer's action plan as the LAST comment:
#               1. analyst drafts specs changes + plan (comment)
#               2. architect reviews it (comment with a verdict)
#               3. analyst applies the review and posts the final plan
#             If a human decision is needed, the question is left in the
#             issue with the `needs-info` label and the stage stops.
# develop  -> developer. On branch issue-<n>, implements the final plan,
#             runs lint/typecheck/tests, pushes and opens the PR. When the
#             PR is open it swaps the `develop` label for `pr-raised`.
# testPR   -> analyst-programmer (label `pr-raised`). Runs the module's
#             test plan on the PR branch before merging and posts the
#             result in the PR conversation. Never merges. The workflow then
#             swaps `pr-raised` for `merge` (passed) or `human-review`
#             (failed, blocked or no result).
# merge    -> architect (label `merge`). Gathers every in-progress issue of
#             the same module(s) (labels `module:<x>`). If any is not ready
#             yet (`human-review`, or still in design/develop/testPR), it
#             waits and does nothing. When all of them carry `merge`, the
#             architect reviews and merges their PRs in dependency order,
#             and the workflow dispatches deploy.yml.
#
# Re-triggers on a human comment too (not just a fresh label), so
# answering a question in the thread re-runs the *current* label's stage.
# Comments and labels written by this workflow use GITHUB_TOKEN, which
# never triggers new workflow runs, so the pipeline cannot loop on itself.
# For the same reason, labels set inside a run do not fire a new run:
# test-pr is chained to develop and merge is chained to test-pr (each also
# runs when a human adds its label or comments on the issue), and a merge
# made with GITHUB_TOKEN does not fire the `push` trigger of deploy.yml,
# so the merge job dispatches it explicitly (workflow_dispatch is allowed).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  actions: write        # merge job: gh workflow run deploy.yml
  contents: write
  issues: write
  pull-requests: write

# One run at a time per issue; queue instead of cancelling so that a
# comment posted mid-run is not lost.
concurrency:
  group: issue-pipeline-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ISSUE_NUMBER: ${{ github.event.issue.number }}
  BRANCH: issue-${{ github.event.issue.number }}

jobs:
  check-permission:
    # Hand-invoking the CLI (instead of the marketplace action) means we
    # lose its built-in write-access check -- added back here, once,
    # shared by every stage job via `needs`. Also ignores PR comments and
    # bot comments.
    if: ${{ !github.event.issue.pull_request && (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') }}
    runs-on: ionos-l1-claude
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [ "$perm" = "admin" ] || [ "$perm" = "write" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # Stage 1: analysis (architect)
  # ---------------------------------------------------------------------
  analysis:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'analysis') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'analysis')))
    runs-on: ionos-l1-claude
    steps:
      - uses: actions/checkout@v6

      - name: Architect - analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full, then specs/README.md and every specs/<module>/ that issue #$ISSUE_NUMBER may touch.
          Read issue #$ISSUE_NUMBER and its whole thread: gh issue view $ISSUE_NUMBER --comments.
          List the child issues it already has: gh issue list --state all --search "Padre: #$ISSUE_NUMBER in:body".

          You are in the ANALYSIS stage. Your job:
          1. Analyse the request against the whole project: architecture, module boundaries, data model, offline, multi-tenant, GDPR and the demo path.
          2. Propose the architecture of the solution and ARGUE every decision (alternatives considered, pros and cons).
          3. Point out errors, contradictions, risks and possible improvements, both in the request and in the current specs/, and give concrete suggestions on how to proceed.
          4. If a decision needs the product owner's approval, ask it (numbered questions, each with a default proposal), add the label with
             gh issue edit $ISSUE_NUMBER --add-label needs-info
             and do NOT create child issues yet. If the thread already answers your previous questions, remove needs-info and continue.
          5. Otherwise create one child issue per development piece (normally one per module affected), following the "design" issue template of the github-issues skill,
             with gh issue create --title "..." --body "..." --label "module:<module>" (create a missing label with gh label create).
             Pass the body inline with --body; do not use pipes, heredocs or temporary files. Do NOT add the design label: a human adds it to approve each child.
             Do not duplicate children that already exist; update them with gh issue edit instead.
          6. Update the task list of issue #$ISSUE_NUMBER with its children (gh issue edit $ISSUE_NUMBER --body "...", keeping the original text).
          You must not modify any file in the repository.

          Your final answer is posted verbatim as a comment on the issue: write it for the product owner, in the same language as the issue, with sections
          Análisis, Arquitectura propuesta, Errores y mejoras detectados, Recomendaciones, Issues creados (or Preguntas pendientes) and Siguiente paso.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(git log:*)" "Bash(git diff:*)" "Bash(git show:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh issue create:*)" "Bash(gh issue edit:*)"
            "Bash(gh label list:*)" "Bash(gh label create:*)"
          )
          claude -p "$PROMPT" \
            --agent architect \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}" \
            --output-format text \
            --max-budget-usd 3 \
            > /tmp/analysis.md

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/analysis.md ] || echo "⚠️ La etapa de análisis ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/analysis.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/analysis.md

  # ---------------------------------------------------------------------
  # Stage 2: design (analyst-programmer, supervised by the architect)
  # ---------------------------------------------------------------------
  design:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'design') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'design')))
    runs-on: ionos-l1-claude
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git remote and identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"

      - name: Create or reuse the issue branch
        run: |
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Analyst - draft design
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH.
          Read issue #$ISSUE_NUMBER and its whole thread (gh issue view $ISSUE_NUMBER --comments), its parent issue and the specs/ of the modules involved.

          You are in the DESIGN stage, step 1 of 3 (draft). Your job:
          1. Update specs/ with the new changes: requirements in specs/<module>/README.md and technical design in specs/<module>/design.md, following the spec-writing and technical-design skills.
             Keep the change history of each file and cite issue #$ISSUE_NUMBER.
          2. Create the module's test plan specs/<module>/test-plan.md from specs/_template/test-plan.md, or update it if it already exists, with test cases PP-<MOD>-NN
             for every acceptance criterion this issue adds or changes. It will be run in the testPR stage on the PR branch, before merging: every case must be
             executable by an agent from the command line (exact commands and a checkable expected result); anything only a person can verify goes to "Comprobaciones manuales".
          3. Commit the specs/ changes on $BRANCH (git add specs/ && git commit -m "docs(<module>): ... (#$ISSUE_NUMBER)"). Do not push. Do not touch anything outside specs/.
          4. Draft the action plan for the developer: files to create or modify, signatures and contracts, step-by-step order, tests per acceptance criterion and definition of done.
          5. List any doubt or decision you need approved. Address it to the architect, who reviews your work in the next step.

          Your final answer is posted verbatim as a comment on the issue, in the same language as the issue, titled
          "## Propuesta del analista (pendiente de revisión del arquitecto)", with sections Cambios en specs, Plan de pruebas, Plan de acción (borrador) and Preguntas para el arquitecto.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Edit(specs/**)" "Write(specs/**)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git add:*)" "Bash(git commit:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)"
          )
          claude -p "$PROMPT" \
            --agent analyst-programmer \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}" \
            --output-format text \
            --max-budget-usd 4 \
            > /tmp/draft.md

      - name: Post draft comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/draft.md

      - name: Architect - review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH.
          Read issue #$ISSUE_NUMBER and its whole thread (gh issue view $ISSUE_NUMBER --comments) and its parent issue.
          The analyst-programmer has just posted a draft design (last comment) and committed specs/ changes: review them with git diff origin/main...HEAD -- specs/.

          You are in the DESIGN stage, step 2 of 3: you supervise the analyst. Your job:
          1. Check that the design fits the architecture agreed in the parent issue and in specs/, respects CLAUDE.md (multi-tenant, GDPR, offline, stack, scope of the pilot) and covers every acceptance criterion.
             Check that specs/<module>/test-plan.md covers every acceptance criterion of the issue and that each case can really be run by an agent before merging.
          2. Point out errors, gaps and improvements, arguing each one, and answer the analyst's questions when you can.
          3. Decide one verdict and write it on the FIRST line of your answer, exactly one of:
             VEREDICTO: APROBADO        -> the analyst can publish the final plan as is
             VEREDICTO: CAMBIOS         -> the analyst must apply your requested changes
             VEREDICTO: PREGUNTA        -> a decision needs the product owner; ask it with numbered questions and a default proposal for each,
                                           and add the label: gh issue edit $ISSUE_NUMBER --add-label needs-info
          You must not modify any file in the repository.

          Your final answer is posted verbatim as a comment on the issue, in the same language as the issue, titled "## Revisión del arquitecto" right after the verdict line.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(git log:*)" "Bash(git diff:*)" "Bash(git show:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh issue edit:*)"
          )
          claude -p "$PROMPT" \
            --agent architect \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}" \
            --output-format text \
            --max-budget-usd 2 \
            > /tmp/review.md
          VERDICT=$(grep -oE 'VEREDICTO: (APROBADO|CAMBIOS|PREGUNTA)' /tmp/review.md | head -1 | cut -d' ' -f2)
          echo "verdict=${VERDICT:-CAMBIOS}" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/review.md

      - name: Analyst - final action plan
        if: steps.review.outputs.verdict != 'PREGUNTA'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH.
          Read issue #$ISSUE_NUMBER and its whole thread (gh issue view $ISSUE_NUMBER --comments). The last two comments are your draft and the architect's review (verdict: $VERDICT).

          You are in the DESIGN stage, step 3 of 3 (final). Your job:
          1. Apply every change requested by the architect to specs/ and commit it on $BRANCH (do not push, do not touch anything outside specs/).
             If you disagree with a point, argue it in your answer instead of ignoring it.
          2. If the thread previously had the needs-info label and the questions are now answered, remove it: gh issue edit $ISSUE_NUMBER --remove-label needs-info
          3. Write the FINAL action plan for the developer. It must be self-contained: the developer only reads this comment, CLAUDE.md and specs/.

          Your final answer is posted verbatim as the LAST comment of the issue, in the same language as the issue, titled
          "## Plan de acción para el desarrollador", with sections Contexto, Rama ($BRANCH), Specs de referencia, Ficheros (table: acción, ruta, contenido),
          Contratos, Pasos en orden, Tests (one per acceptance criterion), Plan de pruebas (link to specs/<module>/test-plan.md and the PP cases the PR must pass),
          Definición de hecho and Cambios respecto a la revisión del arquitecto.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Edit(specs/**)" "Write(specs/**)"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git add:*)" "Bash(git commit:*)"
            "Bash(gh issue view:*)" "Bash(gh issue edit:*)"
          )
          claude -p "$PROMPT" \
            --agent analyst-programmer \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}" \
            --output-format text \
            --max-budget-usd 3 \
            > /tmp/plan.md

      - name: Push the issue branch
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$(git log "origin/$BRANCH..HEAD" 2>/dev/null || git log "origin/$DEFAULT_BRANCH..HEAD")" ]; then
            git push -u origin "$BRANCH"
          fi

      - name: Post final plan comment
        if: steps.review.outputs.verdict != 'PREGUNTA'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/plan.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ La etapa de diseño ha fallado. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # ---------------------------------------------------------------------
  # Stage 3: develop (developer)
  # ---------------------------------------------------------------------
  develop:
    needs: check-permission
    if: needs.check-permission.outputs.allowed == 'true' && ((github.event_name == 'issues' && github.event.label.name == 'develop') || (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'develop')))
    runs-on: ionos-l1-claude
    outputs:
      pr_raised: ${{ steps.pr.outputs.raised }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-${{ github.event.issue.number }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git remote and identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "Claude (automated)"
          git config user.email "noreply@anthropic.com"

      - name: Developer - implement and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH, which already holds the specs/ changes for issue #$ISSUE_NUMBER.
          Read the issue and its whole thread (gh issue view $ISSUE_NUMBER --comments). The comment titled "Plan de acción para el desarrollador"
          (the latest one, if there are several) is your work order; follow it together with the specs/ it references.

          You are in the DEVELOP stage. Your job:
          1. Implement exactly what the plan says, with the tests it lists. Do not make design decisions: if the plan is incomplete or contradictory,
             explain what is missing in your answer, add the label (gh issue edit $ISSUE_NUMBER --add-label needs-info) and stop.
          2. Run npm run lint, npm run typecheck and npm test (and npm run test:e2e if the change touches the demo path) once package.json defines them. Fix any failure.
          3. Commit with Conventional Commits in English citing #$ISSUE_NUMBER, and push: git push -u origin $BRANCH
          4. When the task is ready (plan done, checks green), open the pull request against $DEFAULT_BRANCH, or update it if one already exists
             (gh pr list --head $BRANCH): gh pr create --base $DEFAULT_BRANCH --head $BRANCH --title "<conventional title> (#$ISSUE_NUMBER)" --body "..."
             The body summarises the changes, lists the requirements and acceptance criteria covered, the check results, and ends with "Closes #$ISSUE_NUMBER".
             If the task is not ready, do not open the PR and explain why.
          5. Only once the PR is open, move the issue to the next stage: gh issue edit $ISSUE_NUMBER --remove-label develop --add-label pr-raised
             (create the label first if it does not exist: gh label create pr-raised --color 5319e7 --description "PR abierta: etapa testPR").

          Your final answer is posted verbatim as a comment on the issue, in the same language as the issue: what was done, files touched,
          check results, PR link (or what blocks it).
          EOF
          )
          claude -p "$PROMPT" \
            --agent developer \
            --dangerously-skip-permissions \
            --output-format text \
            --max-budget-usd 10 \
            > /tmp/develop.md

      - name: Push any remaining commits
        if: always()
        run: |
          if [ -n "$(git log "origin/$BRANCH..HEAD")" ]; then
            git push -u origin "$BRANCH"
          fi

      # Safety net for step 5 of the prompt: if an open PR exists but the
      # label was not swapped, swap it here. The output chains test-pr.
      - name: Move the issue to pr-raised
        id: pr
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "raised=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create pr-raised --color 5319e7 --description "PR abierta: etapa testPR" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --remove-label develop --add-label pr-raised
          echo "raised=true" >> "$GITHUB_OUTPUT"

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/develop.md ] || echo "⚠️ La etapa de desarrollo ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/develop.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/develop.md

  # ---------------------------------------------------------------------
  # Stage 4: testPR (analyst-programmer), label `pr-raised`
  # ---------------------------------------------------------------------
  test-pr:
    needs: [check-permission, develop]
    # always() so it is evaluated when develop is skipped (label/comment
    # triggers) and when develop just raised the PR (chained trigger).
    if: >-
      always() && needs.check-permission.outputs.allowed == 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'pr-raised') ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'pr-raised')) ||
        needs.develop.outputs.pr_raised == 'true'
      )
    runs-on: ionos-l1-claude
    outputs:
      result: ${{ steps.result.outputs.result }}
    env:
      # Isolates the test stack from any other compose project on the
      # host (the deployed demo included), so `down -v` cannot touch it.
      COMPOSE_PROJECT_NAME: formia-testpr-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-${{ github.event.issue.number }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          if [ -z "$PR" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ Etapa testPR: no hay ninguna pull request abierta desde \`$BRANCH\`. No se ejecuta el plan de pruebas."
            exit 1
          fi

      - name: Prepare local environment file
        run: cp -n .env.example .env || true

      - name: Analyst - run the test plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full. You are on branch $BRANCH, the head of pull request #$PR_NUMBER for issue #$ISSUE_NUMBER.
          Read the issue and its whole thread (gh issue view $ISSUE_NUMBER --comments), the pull request (gh pr view $PR_NUMBER --comments)
          and the files it changes (git diff origin/$DEFAULT_BRANCH...HEAD --stat).
          Find the test plan: the "Plan de pruebas" section of the latest "Plan de acción para el desarrollador" comment points to specs/<module>/test-plan.md.

          You are in the TESTPR stage. Your job is to verify, before merging, that the pull request passes the test plan:
          1. Run the "Preparación" steps, then every "Comprobaciones generales" check and every PP case that applies to this issue, exactly as written.
             The docker compose project is already isolated through COMPOSE_PROJECT_NAME; do not override it.
          2. For each case record the result: ✅ superado, ❌ fallido (with the relevant part of the output, never secrets or personal data) or ⏭️ no ejecutado (with the reason).
          3. Do not fix anything: do not edit files, commit, push, approve or merge. If a case fails, report it for the developer.
             If the test plan is missing, contradictory or cannot be run, report it for the analyst and the architect and answer BLOQUEADO.
             Do not change labels: the workflow sets `merge` (SUPERADO) or `human-review` (FALLIDO or BLOQUEADO) from your result line.
          4. Run the "Limpieza" steps at the end, even if some case failed.

          The FIRST line of your answer must be exactly one of: RESULTADO: SUPERADO | RESULTADO: FALLIDO | RESULTADO: BLOQUEADO
          Your final answer is posted verbatim in the pull request conversation, in the same language as the issue, titled "## Resultado del plan de pruebas"
          right after the result line, with sections Resumen, Comprobaciones generales (table), Casos de prueba (table: ID, cubre, resultado, detalle),
          Comprobaciones manuales pendientes (for the person who merges) and Siguiente paso.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)"
            "Bash(npm ci:*)" "Bash(npm install:*)" "Bash(npm run:*)" "Bash(npm test:*)" "Bash(npx:*)"
            "Bash(docker compose:*)" "Bash(curl:*)"
            "Bash(gh issue view:*)" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)"
          )
          claude -p "$PROMPT" \
            --agent analyst-programmer \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}" \
            --output-format text \
            --max-budget-usd 4 \
            > /tmp/testpr.md

      - name: Clean up the test stack
        if: always()
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker compose down -v --remove-orphans || true
          fi

      # Only SUPERADO moves the issue to `merge`. Anything else (FALLIDO,
      # BLOQUEADO, a crash with no result line) goes to `human-review`.
      - name: Post result and set the next label
        id: result
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          [ -s /tmp/testpr.md ] || echo "⚠️ La etapa testPR ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/testpr.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/testpr.md
          RESULT=$(grep -oE 'RESULTADO: (SUPERADO|FALLIDO|BLOQUEADO)' /tmp/testpr.md | head -1 | cut -d' ' -f2)
          RESULT=${RESULT:-SIN_RESULTADO}
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

          gh label create merge --color 0e8a16 --description "Plan de pruebas superado: etapa merge" 2>/dev/null || true
          gh label create human-review --color d93f0b --description "Necesita revisión de una persona" 2>/dev/null || true
          if [ "$RESULT" = "SUPERADO" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label pr-raised --remove-label human-review --add-label merge
            gh issue comment "$ISSUE_NUMBER" --body "Etapa testPR: SUPERADO. Detalle en #$PR_NUMBER. El issue pasa a \`merge\`."
          else
            gh issue edit "$ISSUE_NUMBER" --remove-label pr-raised --add-label human-review
            gh issue comment "$ISSUE_NUMBER" --body "Etapa testPR: $RESULT. Detalle en #$PR_NUMBER. El issue pasa a \`human-review\`: una persona tiene que revisarlo. Para repetir las pruebas, pon de nuevo \`pr-raised\`."
          fi

  # ---------------------------------------------------------------------
  # Stage 5: merge (architect), label `merge`
  # ---------------------------------------------------------------------
  merge:
    needs: [check-permission, test-pr]
    if: >-
      always() && needs.check-permission.outputs.allowed == 'true' && (
        (github.event_name == 'issues' && github.event.label.name == 'merge') ||
        (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'merge')) ||
        needs.test-pr.outputs.result == 'SUPERADO'
      )
    runs-on: ionos-l1-claude
    # One merge stage at a time across ALL issues: two issues of the same
    # module turning `merge` together must not merge the same PRs twice.
    concurrency:
      group: issue-pipeline-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Deterministic gate, no agent involved. The group is every OPEN issue
      # that shares a `module:<x>` label with this one. Within the group:
      #   - `merge` with an open PR from issue-<n>  -> ready
      #   - `merge` without an open PR              -> blocking
      #   - `human-review`                          -> blocking (failed)
      #   - design / develop / pr-raised / needs-info -> blocking (in progress)
      #   - no stage label (not started yet, or the `analysis` parent) -> ignored
      - name: Check that every issue of the module is ready
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const labelsOf = (i) => i.labels.map((l) => (typeof l === "string" ? l : l.name));

            const self = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const modules = labelsOf(self).filter((l) => l.startsWith("module:"));

            const group = new Map([[self.number, self]]);
            for (const label of modules) {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: label, per_page: 100 });
              for (const i of issues) if (!i.pull_request) group.set(i.number, i);
            }

            const inProgress = ["design", "develop", "pr-raised", "needs-info"];
            const ready = [], blocking = [], ignored = [];
            for (const i of [...group.values()].sort((a, b) => a.number - b.number)) {
              const labels = labelsOf(i);
              const prs = await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:issue-${i.number}` });
              const pr = prs.data[0];
              const line = `#${i.number} ${i.title}`;
              if (labels.includes("human-review")) blocking.push(`${line} — \`human-review\` (pruebas no superadas)`);
              else if (labels.includes("merge") && pr) ready.push({ issue: i.number, pr: pr.number, title: i.title });
              else if (labels.includes("merge")) blocking.push(`${line} — \`merge\` pero sin PR abierta desde \`issue-${i.number}\``);
              else if (labels.some((l) => inProgress.includes(l))) blocking.push(`${line} — en curso (\`${labels.filter((l) => inProgress.includes(l)).join("`, `")}\`)`);
              else ignored.push(line);
            }

            const list = (xs) => (xs.length ? xs.map((x) => `- ${x}`).join("\n") : "- (ninguno)");
            const summary = [
              `Módulos: ${modules.length ? modules.map((m) => `\`${m}\``).join(", ") : "(el issue no tiene etiqueta \`module:<x>\`; solo se considera él mismo)"}`,
              "", "**Listos (`merge` con PR abierta):**", list(ready.map((r) => `#${r.issue} ${r.title} → PR #${r.pr}`)),
              "", "**Pendientes:**", list(blocking),
              "", "**Sin empezar (no bloquean):**", list(ignored),
            ].join("\n");

            core.setOutput("ready", blocking.length === 0 && ready.length > 0 ? "true" : "false");
            core.setOutput("prs", JSON.stringify(ready));
            core.setOutput("summary", summary);

      - name: Report that the module is not ready yet
        if: steps.gate.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.gate.outputs.summary }}
        run: |
          printf '## Etapa merge: en espera\n\nNo se fusiona nada todavía: hay issues del mismo módulo que no están listos. La etapa se repetirá cuando otro issue del módulo pase a `merge` (o al volver a poner `merge` en este).\n\n%s\n' "$SUMMARY" > /tmp/merge.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/merge.md

      - name: Architect - review and merge the module
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.gate.outputs.prs }}
          SUMMARY: ${{ steps.gate.outputs.summary }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PROMPT=$(cat <<EOF
          Read CLAUDE.md in full and specs/README.md. Issue #$ISSUE_NUMBER has just reached the MERGE stage.
          The workflow has already checked that every in-progress issue of its module(s) carries the merge label (tests passed):
          $SUMMARY

          Pull requests to merge (JSON, issue -> PR): $PRS

          You are in the MERGE stage. Your job is to incorporate the module's functionality into $DEFAULT_BRANCH:
          1. For each issue read its thread (gh issue view <n> --comments) and its PR (gh pr view <pr> --comments): the last "Resultado del plan de pruebas"
             must be RESULTADO: SUPERADO for the PR's current head commit, CI checks must be green (gh pr checks <pr>) and the PR must be mergeable
             (gh pr view <pr> --json mergeable,mergeStateStatus,headRefOid,baseRefName). The base branch must be $DEFAULT_BRANCH.
          2. Check that the PRs together fit the architecture in specs/ and do not contradict each other.
          3. Decide the merge order from the "Depende de: #<n>" lines (dependencies first; otherwise ascending issue number).
          4. If every PR passes these checks, merge them one by one in that order with
             gh pr merge <pr> --merge --subject "Merge pull request #<pr>: <title>"
             Re-check mergeable before each merge, because a previous merge can create conflicts.
          5. If a PR fails a check or cannot be merged, do NOT merge it or any PR after it in the order. Explain why, addressed to the person who reviews it,
             and mark that issue: gh issue edit <n> --remove-label merge --add-label human-review
             PRs already merged stay merged; say so clearly.
          Do not edit files, push, approve PRs or close issues by hand (the "Closes #<n>" of each PR closes its issue). Deployment is triggered by the workflow afterwards.

          The FIRST line of your answer must be exactly one of: FUSIÓN: COMPLETA | FUSIÓN: PARCIAL | FUSIÓN: NINGUNA
          Your final answer is posted verbatim as a comment on issue #$ISSUE_NUMBER, in the same language as the issue, titled "## Etapa merge"
          right after that line, with sections Revisión (table: issue, PR, pruebas, CI, mergeable, veredicto), Orden de fusión, Resultado and Siguiente paso.
          EOF
          )
          ALLOWED=(
            "Read" "Grep" "Glob"
            "Bash(git log:*)" "Bash(git diff:*)" "Bash(git show:*)" "Bash(git fetch:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh issue edit:*)"
            "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)" "Bash(gh pr list:*)" "Bash(gh pr merge:*)"
          )
          claude -p "$PROMPT" \
            --agent architect \
            --permission-mode dontAsk \
            --allowedTools "${ALLOWED[@]}" \
            --output-format text \
            --max-budget-usd 3 \
            > /tmp/merge.md

      # Counts merges from GitHub itself, not from the agent's answer.
      - name: Dispatch the deployment if anything was merged
        id: deploy
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.gate.outputs.prs }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          MERGED=""
          for PR in $(echo "$PRS" | grep -oE '"pr":[0-9]+' | cut -d: -f2); do
            if [ "$(gh pr view "$PR" --json state --jq .state)" = "MERGED" ]; then
              MERGED="$MERGED #$PR"
            fi
          done
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"
          if [ -n "$MERGED" ]; then
            gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
          fi

      - name: Post result comment
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED: ${{ steps.deploy.outputs.merged }}
        run: |
          [ -s /tmp/merge.md ] || echo "⚠️ La etapa merge ha fallado sin respuesta. Revisa el log de la ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/merge.md
          if [ -n "$MERGED" ]; then
            printf '\n\n---\nPRs fusionadas:%s. Despliegue lanzado: %s/%s/actions/workflows/deploy.yml\n' "$MERGED" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> /tmp/merge.md
          else
            printf '\n\n---\nNo se ha fusionado ninguna PR; no se despliega.\n' >> /tmp/merge.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/merge.md
