# PostgreSQL y MinIO solo arrancan si su perfil está activo. Se activan con
# COMPOSE_PROFILES en .env (docker compose lo lee de ahí):
#   COMPOSE_PROFILES=postgres,minio   -> los dos (valor de .env.example)
#   COMPOSE_PROFILES=postgres         -> sin MinIO
#   COMPOSE_PROFILES=none             -> ninguno (servicios externos)
# Mailpit no tiene perfil: arranca siempre.
# Ojo: `down` solo para los servicios de los perfiles activos.
services:
  postgres:
    image: postgres:16
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: formia
      POSTGRES_PASSWORD: formia
      POSTGRES_DB: formia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formia"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
